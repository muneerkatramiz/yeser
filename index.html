<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>غرفة تتبع حركة الناقلات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header class="cc-header">
      <div class="cc-header-top">
        <div>
          <div class="cc-title">غرفة تتبع حركة الناقلات</div>
          <div class="cc-subtitle">عُمان ← الكويت / السعودية / الإمارات</div>
        </div>
        <div class="cc-total-pill">إجمالي الحركات: <b id="totalPill">0</b></div>
      </div>
      <nav class="cc-tabs">
        <div class="cc-tab active" data-tab="dashboard">لوحة المتابعة</div>
        <div class="cc-tab" data-tab="records">السجل الكامل</div>
        <div class="cc-tab" data-tab="add">إضافة حركة جديدة</div>
      </nav>
    </header>

    <main class="cc-main">
      <section id="view-dashboard" class="cc-view"></section>
      <section id="view-records" class="cc-view" style="display:none"></section>
      <section id="view-add" class="cc-view" style="display:none"></section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
